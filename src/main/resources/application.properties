spring.application.name=prooflane
spring.application.name=prooflane
spring.main.web-application-type=none
spring.ai.model.chat=${PROOFLANE_SPRING_AI_MODEL:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${PROOFLANE_OPENAI_MODEL:gpt-5-mini}

prooflane.agent.mode=${PROOFLANE_AGENT_MODE:no-llm}
prooflane.guardrails.max-evidence-chars=${PROOFLANE_MAX_EVIDENCE_CHARS:12000}
prooflane.guardrails.max-llm-calls=${PROOFLANE_MAX_LLM_CALLS:1}
prooflane.guardrails.estimated-input-token-budget=${PROOFLANE_INPUT_TOKEN_BUDGET:4000}
prooflane.guardrails.estimated-output-token-budget=${PROOFLANE_OUTPUT_TOKEN_BUDGET:800}
