name: Bug
description: Report incorrect workflow, evidence, routing, or guardrail behavior.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, repo state, input, and output.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety Or Cost Impact
      description: Any token spend, secret exposure, command execution, or misleading delivery claim?

